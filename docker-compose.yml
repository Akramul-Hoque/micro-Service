version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: hoteldb
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  service-registry:
    build: ./serviceRegistry
    container_name: service-registry
    ports:
      - "8761:8761"
    depends_on:
      - mysql

  config-server:
    build: ./configServer
    container_name: config-server
    ports:
      - "8888:8888"
    depends_on:
      - service-registry

  user-service:
    build: ./userService
    container_name: user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/hoteldb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    ports:
      - "8083:8083"
    depends_on:
      - mysql
      - service-registry

  auth-service:
    build: ./authService
    container_name: auth-service
    environment:
      USER_SERVICE_URL: http://user-service:8083
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    ports:
      - "8084:8084"
    depends_on:
      - user-service
      - service-registry

  api-gateway:
    build: ./apiGateway
    container_name: api-gateway
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      - service-registry
      - auth-service
      - user-service

volumes:
  db_data:
